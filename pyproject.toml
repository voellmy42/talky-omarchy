[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "talky-local"
version = "0.1.0"
description = "Native local dictation for Omarchy and Hyprland"
requires-python = ">=3.11"

[project.scripts]
talky = "talky.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
